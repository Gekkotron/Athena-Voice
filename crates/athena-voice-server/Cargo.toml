[package]
name = "athena-voice-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[test]]
name = "test_tts"
path = "tests/test_tts.rs"

[dependencies]
athena-voice-core = { workspace = true }
athena-voice-storage = { workspace = true }
athena-voice-providers = { workspace = true }
athena-voice-runtime = { workspace = true }
tokio.workspace = true
tokio-util = { workspace = true, features = ["codec"] }
tokio-stream.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
webrtcvad = { path = "../webrtcvad" }
tract-onnx = "=0.21.12"
once_cell = "1.19"
anyhow = "1.0"
thiserror = "2.0"
bytes = "1.0"
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
sqlx.workspace = true
bindgen = "0.72.1"

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tokio-test = "0.4"
