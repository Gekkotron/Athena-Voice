[package]
name = "athena-voice-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Actor DAG, MQTT client, satellite adapter, and event bus for Athena-Voice."

[dependencies]
arc-swap = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
notify = { workspace = true }
notify-debouncer-full = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }
extism = { workspace = true }
futures = { workspace = true }
rodio = { version = "0.19", optional = true }
reqwest = { workspace = true }
rumqttc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
toml = "0.8"
uuid = { workspace = true }
strsim = { workspace = true }

athena-voice-core = { path = "../athena-voice-core", version = "0.1" }
athena-voice-providers = { path = "../athena-voice-providers", version = "0.1" }
athena-voice-skill-sdk = { path = "../athena-voice-skill-sdk", version = "0.1" }
athena-voice-storage = { path = "../athena-voice-storage", version = "0.1" }

[features]
# `audio` is opt-in: local playback of skill-emitted audio chunks. Not a
# default so `cargo check --workspace` stays green on machines without an
# audio stack.
default = []
audio = ["dep:rodio"]
# Exposes `test_support`: paths to the `.wasm` fixtures this crate's
# `build.rs` already builds for its own integration tests. Other crates'
# tests (e.g. athena-voice-admin) enable this via a `dev-dependencies`
# feature override so they can load a real skill without depending on the
# gitignored `skills/*.wasm` bundle or duplicating the build step.
test-support = []

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "test-util"] }
rumqttd = { version = "0.19", default-features = false }
tempfile = "3"
portpicker = "0.1"
tracing-subscriber = { workspace = true }
wiremock = { workspace = true }
uuid = { version = "1.0", features = ["v4"] }

[lints]
workspace = true
