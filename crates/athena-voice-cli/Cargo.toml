[package]
name = "athena-voice-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Athena-Voice command-line binary."

[lib]
path = "src/lib.rs"

[[bin]]
name = "athena-voice"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
figment = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

athena-voice-admin = { workspace = true }
athena-voice-core = { path = "../athena-voice-core", version = "0.1" }
athena-voice-providers = { path = "../athena-voice-providers", version = "0.1" }
# The runtime's `audio` feature (local playback of skill audio via rodio)
# is opt-in: `cargo build -p athena-voice-cli --features audio`.
athena-voice-runtime = { path = "../athena-voice-runtime", version = "0.1", default-features = false }
athena-voice-storage = { path = "../athena-voice-storage", version = "0.1" }

[dev-dependencies]
assert_cmd = { workspace = true }
athena-voice-providers = { path = "../athena-voice-providers", version = "0.1" }
predicates = { workspace = true }
serial_test = "3"
tempfile = "3"

[lints]
workspace = true

[features]
audio = ["athena-voice-runtime/audio"]
