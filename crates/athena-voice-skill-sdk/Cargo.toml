[package]
name = "athena-voice-skill-sdk"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Guest-side SDK for Athena-Voice WASM skills. Host uses the same types."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
strsim = { workspace = true }
thiserror = { workspace = true }

# Guest-only: the Extism PDK is used to import the host functions declared in
# `crates/athena-voice-runtime/src/wasm/host_fns.rs`. Skills targeting
# `wasm32-wasip1` link against it; host-side consumers of the SDK never do.
[target.'cfg(target_family = "wasm")'.dependencies]
extism-pdk = "1"

[lints]
workspace = true
