# Local FULL VOICE config: real STT (whisper.cpp) and real TTS (macOS say),
# both bridged over MQTT by worker processes.
#
#   1. brew services start mosquitto                       (once)
#   2. Download a real whisper model (once, ~465 MB):
#        curl -L -o models/ggml-small.bin \
#          https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.bin
#      and build whisper.cpp (once):
#        cd whisper.cpp && cmake -B build && cmake --build build -j --target whisper-cli
#   3. cargo run -p athena-voice-stt-worker                 (own terminal)
#   4. cargo run -p athena-voice-tts-worker                 (own terminal)
#   5. cargo run -p athena-voice-cli -- serve --config athena.voice.toml
#   6. Ask by voice or file:
#        cargo run -p athena-voice-client -- --microphone --play --timeout-secs 30
#        cargo run -p athena-voice-client -- --wav test.wav --play --timeout-secs 30

locales = ["fr", "en"]

[server]
host = "127.0.0.1"
port = 8080

[storage]
database_url = "sqlite:///tmp/athena-voice.db?mode=rwc"

[mqtt]
host = "127.0.0.1"
port = 1883
client_id = "athena-voice-local"

[providers]
stt = { mqtt_stt = { name = "whisper" } }
# No LLM by default: skills handle what they match, and unmatched
# questions get a spoken capabilities answer. Fully offline, no model.
llm = "none"
# Opt-in alternatives for free-form answers (with the backend down, the
# runtime speaks a locale-aware apology instead of hanging):
#   local Ollama:   llm = { ollama = { base_url = "http://localhost:11434", model = "llama3.2:1b" } }
#   any OpenAI-compatible endpoint (LAN llama.cpp/vLLM/Ollama, or hosted —
#   key comes from the named env var, never from this file):
#   llm = { openai_compatible = { base_url = "http://192.168.1.10:11434/v1", model = "llama3.2:1b", api_key_env = "OPENAI_API_KEY" } }
tts = { mqtt_tts = { name = "say" } }

[skills]
dir = "./skills"

[skills.weather]
http_allowlist = ["geocoding-api.open-meteo.com", "api.open-meteo.com"]
config = { default_city = "Strasbourg" }

# Jeedom sensors — configure via the web UI (http://127.0.0.1:8080 once
# `serve` is running): the API key and sensor list are stored in the
# SQLite database, never in this file. See README "Web configuration".
# Leaving this section absent is fine; the skill stays dormant until
# configured.
