# The filesystem-watcher test relies on macOS FSEvents + a 250 ms debouncer
# thread; under a fully parallel test run it gets starved and misses its
# windows. Reserving most execution slots effectively serializes it.
[[profile.default.overrides]]
filter = 'test(tempdir_watcher_yields_add_modify_remove_events)'
threads-required = 8
retries = 2
