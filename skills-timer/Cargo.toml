[package]
name = "skills-timer"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
authors = ["Gekkotron <60887050+Gekkotron@users.noreply.github.com>"]
repository = "https://github.com/Gekkotron/Athena-Voice"
description = "Timer / reminder WASM skill for Athena-Voice."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
athena-voice-skill-sdk = { path = "../crates/athena-voice-skill-sdk", version = "0.1" }
extism-pdk = "1"
serde_json = "1"
duration-str = "0.3.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = "symbols"
