[workspace]
resolver = "2"
members = [
    "crates/athena-voice-core",
    "crates/athena-voice-storage",
    "crates/athena-voice-providers",
    "crates/athena-voice-runtime",
    "crates/athena-voice-cli",
    "crates/athena-voice-skill-sdk",
    "crates/athena-voice-tts-worker",
    "crates/athena-voice-server",
    "crates/athena-voice-client",
]
exclude = [
    # The skills-* crates compile to wasm32-wasip1 and can't share the
    # workspace's native target. Each has a build.sh producing
    # skills/<name>.wasm; the runtime's build.rs also builds the ones its
    # integration tests need.
    "skills-smoke-test",
    "skills-timer",
    "skills-home",
    "skills-weather",
    "skills-audio-test",
    "skills-tmp-test",
    # Scratch crate, not part of the product build.
    "test-minimal",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["Gekkotron <60887050+Gekkotron@users.noreply.github.com>"]
repository = "https://github.com/Gekkotron/Athena-Voice"

[workspace.dependencies]
# core
async-trait = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
athena-voice-core = { path = "crates/athena-voice-core" }
athena-voice-storage = { path = "crates/athena-voice-storage" }
athena-voice-providers = { path = "crates/athena-voice-providers" }
athena-voice-runtime = { path = "crates/athena-voice-runtime" }

# runtime
arc-swap = "1"
dashmap = "6"
notify = "8"
notify-debouncer-full = "0.5"
futures = "0.3"
extism = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rumqttc = { version = "0.24", default-features = false, features = ["use-native-tls"] }
strsim = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }

# tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# storage
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }

# cli
clap = { version = "4", features = ["derive", "env"] }
figment = { version = "0.10", features = ["toml", "env"] }
anyhow = "1"

# dev only
assert_cmd = "2"
predicates = "3"
wiremock = "0.6"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Noisy pedantic lints muted while the codebase is still under construction:
doc_markdown = "allow"          # We use natural prose in doc comments.
must_use_candidate = "allow"    # Adding #[must_use] to every getter is churn.
needless_pass_by_value = "allow"  # Actor-DAG code often takes owned values by design.
result_large_err = "allow"      # Error variants with source strings are inherently large.

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
