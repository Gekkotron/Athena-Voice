services:
  athena:
    image: ghcr.io/gekkotron/athena-voice:latest
    restart: unless-stopped
    ports:
      - "8080:8080"        # admin web UI
    volumes:
      - athena-data:/data  # SQLite: admin token + web-edited skill settings
    # Your config (broker address, credentials). Create it first:
    #   cp athena.docker.example.toml athena.docker.toml
    # A `configs` mount (not a bind volume) so a missing file makes compose
    # refuse to start with a clear error instead of silently creating a
    # directory at the path.
    configs:
      - source: athena_config
        target: /app/athena.docker.toml

  # Optional bundled broker for setups without an existing MQTT broker:
  #   docker compose --profile broker up -d      (and ./update.sh --profile broker)
  #   with [mqtt] host = "mosquitto" in athena.docker.toml
  mosquitto:
    image: eclipse-mosquitto:2
    profiles: ["broker"]
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

volumes:
  athena-data:

configs:
  athena_config:
    file: ./athena.docker.toml
