[build]
# Default chip: classic ESP32 (WROOM). Build for an ESP32-S3 with
#   MCU=esp32s3 ./build.sh   (build.sh maps MCU to the matching --target).
target = "xtensa-esp32-espidf"

[target.xtensa-esp32-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor"
rustflags = ["--cfg", "espidf_time64"]

[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
# Overridden by the real environment when set (cargo [env] does not
# force): MCU=esp32s3 ./build.sh picks the S3.
MCU = "esp32"
ESP_IDF_VERSION = "v5.3.3"
# Stage the custom partition table into embuild's generated CMake
# project (CONFIG_PARTITION_TABLE_CUSTOM_FILENAME resolves there, not in
# the crate). Harmless on the esp32 target, which uses the default table.
ESP_IDF_GLOB_PARTTABLE_BASE = { value = ".", relative = true }
ESP_IDF_GLOB_PARTTABLE_CSV = "partitions_s3.csv"
