[package]
name = "athena-satellite-esp32"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
authors = ["Gekkotron <60887050+Gekkotron@users.noreply.github.com>"]

# Standalone: never join the repo's native-target workspace (this crate
# targets xtensa-esp32s3-espidf).
[workspace]

[[bin]]
name = "athena-satellite-esp32"
path = "src/main.rs"

[features]
default = ["hardware"]
# Everything that needs ESP-IDF. Host tests run with --no-default-features
# (see test.sh) so the protocol logic stays testable without the Xtensa
# toolchain or an ESP-IDF checkout.
hardware = ["dep:esp-idf-svc"]

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
esp-idf-svc = { version = "0.51", optional = true }
# Build-time config (pure proc macro, no ESP deps) — kept out of the
# `hardware` feature so host tests can check the generated constant.
toml-cfg = "0.2"

[build-dependencies]
embuild = "0.33"
toml-cfg = "0.2"

# esp-sr provides WakeNet (on-device wake word). Models are S3/P4-only:
# the classic ESP32 build compiles the component but selects no model and
# never references it (src/wake.rs is cfg(esp32s3)).
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp-sr", version = "=2.5.3" }
bindings_header = "src/sr_bindings.h"
bindings_module = "sr"

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"
