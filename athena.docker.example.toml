# Athena-Voice — container profile.
#
#   cp athena.docker.example.toml athena.docker.toml
#
# then edit the [mqtt] block below with your broker's address (and
# credentials if it needs them). Your copy is gitignored — it never blocks
# ./update.sh and can never be committed. docker-compose bind-mounts it
# into the container; a copy of this example is also baked into the image
# as the fail-fast default.
#
# Every key can also be overridden by environment variables if you prefer:
# ATHENA__SECTION__KEY (e.g. ATHENA__MQTT__PASSWORD=... in the compose
# environment).

locales = ["fr", "en"]

[server]
host = "0.0.0.0"          # admin web UI, published by docker-compose on :8080
port = 8080
session_idle_secs = 120

[storage]
database_url = "sqlite:///data/athena-voice.db?mode=rwc"

[mqtt]
host = "192.168.1.2"      # <-- your LAN broker (or "mosquitto" with --profile broker)
port = 1883
client_id = "athena-voice"
# username = "athena"
# password = "change-me"  # or keep secrets out of the file via ATHENA__MQTT__PASSWORD

[providers]
stt = "fake"              # unused by the assist bridge
llm = "none"              # unmatched questions get a spoken capabilities answer
tts = "fake"              # unused by the assist bridge

[assist]
enabled = true
topic_prefix = "assist"
locale = "fr"

[skills]
dir = "/data/skills"
bundled_dir = "/app/skills"

[skills.weather]
http_allowlist = ["geocoding-api.open-meteo.com", "api.open-meteo.com"]

[skills.jeedom]
# Configure base_url/api_key via the admin web UI (stored in SQLite, not here).
http_allowlist = []
