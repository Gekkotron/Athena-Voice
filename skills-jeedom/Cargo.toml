[package]
name = "skills-jeedom"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
authors = ["Gekkotron <60887050+Gekkotron@users.noreply.github.com>"]
repository = "https://github.com/Gekkotron/Athena-Voice"
description = "Jeedom sensor connector WASM skill for Athena-Voice."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
athena-voice-skill-sdk = { path = "../crates/athena-voice-skill-sdk", version = "0.1" }
extism-pdk = "1"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = "symbols"

# Standalone: never claimed by an ancestor workspace, even when the repo is
# checked out as a git worktree nested inside another checkout.
[workspace]
