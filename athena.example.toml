# Athena-Voice — example configuration.
# Copy to `athena.toml` and adjust.

locales = ["fr", "en"]

[server]
host = "0.0.0.0"
port = 8080

[storage]
# Any sqlx-compatible URL. Use "sqlite::memory:" for ephemeral tests.
database_url = "sqlite:./athena.db"

[mqtt]
host = "127.0.0.1"
port = 1883
client_id = "athena-voice"
keep_alive_secs = 30
# username = "athena"
# password = "changeme"

# ─────────────────────────────────────────────────────────────────────────────
# Providers
#
# `fake` is the default — deterministic fakes for tests and initial bring-up.
#
# For real deployments, pick one of the concrete variants (uncomment):
#
#   [providers.llm.ollama]
#   base_url = "http://localhost:11434"
#   model    = "llama3.2:3b"
#
#   [providers.stt.mqtt_stt]
#   name = "whisper"
#
#   [providers.tts.mqtt_tts]
#   name = "piper"
#
# The MQTT-based providers each open their own connection to the broker and
# subscribe to `athena/providers/{stt,tts}/<name>/response` — deploy a
# language-agnostic worker (any language with an MQTT client) that subscribes
# to `athena/providers/{stt,tts}/<name>/request` and publishes replies.
# ─────────────────────────────────────────────────────────────────────────────

[providers]
stt = "fake"
llm = "fake"
tts = "fake"

# ─────────────────────────────────────────────────────────────────────────────
# Skills (WASM)
#
# `dir` is scanned at startup for `*.wasm` skill plugins. With no directory
# set — or an empty directory — the runtime behaves like Plan 3 (no skills
# loaded, everything falls through to the LLM).
#
# Per-skill config sits under `[skills.<name>]`, where `<name>` matches the
# skill's `.wasm` filename stem. Each skill gets its own HTTP allowlist and
# an opaque `config` map surfaced via `host_config_get`.
# ─────────────────────────────────────────────────────────────────────────────

[skills]
dir = "/etc/athena-voice/skills"
# Watch `dir` for `*.wasm` changes and hot-reload plugins in place. Leave
# `false` in production — dev-only convenience. Adds a debounced filesystem
# watcher (~250 ms) that emits `Event::SkillReloaded` / `SkillReloadFailed`
# on change; a failed rebuild keeps the previous plugin loaded.
hot_reload = false

# Example — uncomment and adapt once you drop a `weather.wasm` into `dir`:
#
#   [skills.weather]
#   http_allowlist = ["api.open-meteo.com"]
#   config = { units = "metric", default_city = "Paris" }
