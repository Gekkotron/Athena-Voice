# Athena-Voice — example configuration.
# Copy to `athena.toml` and adjust.
#
# Any value in this file can be overridden with environment variables:
# ATHENA__SERVER__PORT=9090, ATHENA__MQTT__HOST=broker.local, etc.
# (double underscore separates nesting levels).

locales = ["fr", "en"]

[server]
# Close sessions with no inbound audio/text after this many seconds —
# covers satellites that die without sending `end`. Default 120.
# session_idle_secs = 120
host = "127.0.0.1"
# Set to 0.0.0.0 to reach the web UI from your LAN (token still required).
port = 8080

[storage]
# Any sqlx-compatible URL. Use "sqlite::memory:" for ephemeral tests.
database_url = "sqlite:./athena.db"

[mqtt]
host = "127.0.0.1"
port = 1883
client_id = "athena-voice"
keep_alive_secs = 30
# username = "athena"
# password = "changeme"

# ─────────────────────────────────────────────────────────────────────────────
# Providers
#
# `fake` is the default — deterministic fakes for tests and initial bring-up.
#
# For real deployments, pick one of the concrete variants (uncomment):
#
#   [providers.llm.ollama]
#   base_url = "http://localhost:11434"
#   model    = "llama3.2:3b"
#
#   [providers.stt.mqtt_stt]
#   name = "whisper"
#
#   [providers.tts.mqtt_tts]
#   name = "piper"
#
# The MQTT-based providers each open their own connection to the broker and
# subscribe to `athena/providers/{stt,tts}/<name>/response` — deploy a
# language-agnostic worker (any language with an MQTT client) that subscribes
# to `athena/providers/{stt,tts}/<name>/request` and publishes replies.
# ─────────────────────────────────────────────────────────────────────────────

[providers]
stt = "fake"
llm = "fake"
tts = "fake"

# ─────────────────────────────────────────────────────────────────────────────
# Skills (WASM)
#
# `dir` is scanned at startup for `*.wasm` skill plugins. With no directory
# set — or an empty directory — the runtime behaves like Plan 3 (no skills
# loaded, everything falls through to the LLM).
#
# Per-skill config sits under `[skills.<name>]`, where `<name>` matches the
# skill's `.wasm` filename stem. Each skill gets its own HTTP allowlist and
# an opaque `config` map surfaced via `host_config_get`.
# ─────────────────────────────────────────────────────────────────────────────

[skills]
dir = "/etc/athena-voice/skills"
# Watch `dir` for `*.wasm` changes and hot-reload plugins in place. Leave
# `false` in production — dev-only convenience. Adds a debounced filesystem
# watcher (~250 ms) that emits `Event::SkillReloaded` / `SkillReloadFailed`
# on change; a failed rebuild keeps the previous plugin loaded.
hot_reload = false
# Prebuilt skills offered by the web UI's install picker (optional).
# bundled_dir = "/usr/share/athena-voice/bundled-skills"

# Per-skill sub-tables carry three optional knobs:
#
#   * `http_allowlist`         — bare host names the skill may reach via
#                                `host_http_get_json`.
#   * `mqtt_publish_allowlist` — extra MQTT topic filters (with `+` / `#`
#                                wildcards) the skill may publish to on top of
#                                its default `athena/skills/<name>/*`
#                                namespace. Empty (or missing) keeps the
#                                default ACL untouched.
#   * `config`                 — opaque string map surfaced to the guest via
#                                `host_config_get`.
#
# Example — uncomment and adapt once you drop a `weather.wasm` into `dir`:
#
#   [skills.weather]
#   http_allowlist = ["geocoding-api.open-meteo.com", "api.open-meteo.com"]
#   config = { default_city = "Paris", units = "celsius" }
#
    # Example — home automation skill publishing to a Zigbee2MQTT-style broker:
    # 
    # [skills.home]
    # mqtt_publish_allowlist = ["home/+/light/set", "home/+/switch/set"]

# Jeedom sensor connector: read sensor values by voice ("donne-moi la
# température du salon"). `sensors` is a JSON array mapping spoken names to
# Jeedom command ids; the api key travels only on your LAN but restrict it
# to the commands you expose.
# [skills.jeedom]
# http_allowlist = ["jeedom.local"]
# config = { base_url = "http://jeedom.local", api_key = "YOUR_KEY", sensors = '[{"name":"température du salon","id":123,"unit":"degrés"}]' }
    # config = { entities = '[{"name":"lumière du salon","room":"salon","kind":"light","set_topic":"home/salon/light/set","on_payload":"ON","off_payload":"OFF"}]' }
    # # Optional retention policy: delete keys older than 1 hour
    # retention = { gc_after_sec = 3600 }
